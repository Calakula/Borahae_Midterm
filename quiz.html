<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <nav class="navbar navbar-expand-lg site-nav sticky-top" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand" href="index.html">Borahae<span class="brand-dot">.</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="members.html">Members</a></li>
          <li class="nav-item"><a class="nav-link" href="discography.html">Discography</a></li>
          <li class="nav-item"><a class="nav-link" href="timeline.html">Timeline</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="quiz.html">ARMY Quiz</a></li>
          <li class="nav-item"><a class="nav-link" href="join.html">Join</a></li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<main>
  <section class="page-head container">
    <p class="eyebrow">Test yourself</p>
    <h1>The <span class="gradient-text">ARMY quiz</span></h1>
  </section>

  <section class="container">
    <div class="quiz-box glass-card">
      <div class="progress mb-3" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-wrap">
        <div class="progress-bar" id="progress-bar" style="width:0%"></div>
      </div>
      <p class="text-muted-2 small mb-1" id="counter">Question 1 of 5</p>
      <h2 class="h4 mb-3" id="question"></h2>
      <div id="options"></div>
      <div class="d-flex justify-content-between align-items-center mt-3">
        <span id="feedback" class="text-muted-2" aria-live="polite"></span>
        <button type="button" class="btn btn-army" id="next-btn" disabled>Next</button>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
    <span>Borahae — unofficial fan project for a university course. Not affiliated with BTS or HYBE.</span>

  </div>
